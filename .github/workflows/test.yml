# Push na main je objava — GitHub Pages streže datoteke naravnost iz veje in
# testov ne čaka. Ta workflow jih zato požene vzporedno in glasno pove, če je
# kaj narobe: objava se ne ustavi, ampak veš takoj, ne šele ko ti nekaj ne dela.
#
# Če boš kdaj hotel, da pokvarjena koda sploh ne pride ven, je pot ta, da Pages
# preklopiš na objavo iz Actions in ta workflow postaviš pred korak objave.

name: Testi

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: npm test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # config.js s Supabase ključem ni v repozitoriju; test rabi samo, da
      # datoteka obstaja, ker jo index.html naloži. Prazna konfiguracija
      # pomeni, da se oblak ne vklopi — točno tako, kot mora biti v testu.
      - name: Pripravi prazen config.js, če ga ni
        run: |
          if [ ! -f config.js ]; then
            echo 'window.OGLASNI_CONFIG={url:"",anonKey:""};' > config.js
          fi

      - run: npm ci

      - run: npm test
