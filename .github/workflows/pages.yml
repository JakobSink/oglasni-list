name: Objava na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  objavi:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.objava.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Vklopi in nastavi Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Pripravi statične datoteke
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Objavi
        id: objava
        uses: actions/deploy-pages@v4
