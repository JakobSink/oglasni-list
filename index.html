<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oglasni list — kreative, budget in izračun profita</title>
<meta name="description" content="Delovni prostor za pisanje oglasnih kreativ za Facebook in Google, načrtovanje budgeta ter izračun marže, CPA in profita na naročilo.">
<meta name="theme-color" content="#0E1117">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="styles.css">
<script>
try{var t=localStorage.getItem("oglasni-list-tema");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);}catch(e){}
</script>
</head>
<body>

<div class="shell">

  <aside class="side" id="side">
    <div class="side-head">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 40 40" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="4" width="32" height="32" rx="10"/>
          <path d="M11 13h18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-9l-5 4v-4h-4a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2z" fill="none"/>
          <path d="M14 22.5l3.5-3.5 2.5 2 4-5" fill="none"/>
        </svg>
      </span>
      <span class="side-name"><b>Oglasni list</b><em>kreative · budget · profit</em></span>
      <button class="side-close" id="sideClose" aria-label="Zapri meni">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div class="side-pick">
      <label class="sw"><span>Mapa</span><select id="prsel" aria-label="Izbrani projekt"></select></label>
      <label class="sw"><span>Izdelek</span><select id="psel" aria-label="Izbrani izdelek"></select></label>
      <button class="btn btn-p btn-w" id="pnew">Nov izdelek</button>
    </div>

    <nav class="rail" id="rail" role="tablist" aria-label="Razdelki" aria-orientation="vertical">
      <button class="tab" role="tab" id="tab-projekti" aria-controls="v-projekti" data-v="projekti">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h3.6a2 2 0 0 1 1.5.7L11.5 7H19a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>
        Projekti</button>
      <button class="tab" role="tab" id="tab-pregled" aria-controls="v-pregled" data-v="pregled">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V9M10 19V5M16 19v-6M22 19H2"/></svg>
        Pregled</button>
      <button class="tab" role="tab" id="tab-kreative" aria-controls="v-kreative" data-v="kreative">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M3 17l4.5-4 3 2.5L15 11l6 5"/></svg>
        Kreative</button>
      <button class="tab" role="tab" id="tab-kalkulator" aria-controls="v-kalkulator" data-v="kalkulator">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 7h8M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01"/></svg>
        Kalkulator</button>
      <button class="tab" role="tab" id="tab-podatki" aria-controls="v-podatki" data-v="podatki">
        <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>
        Podatki in vodnik</button>
    </nav>

    <div class="side-foot">
      <button class="side-oblak" id="sideOblak" title="Skupen račun ekipe — klikni za prijavo in sinhronizacijo">
        <span class="dot" id="sideOblakDot"></span>
        <span class="side-oblak-t"><b id="sideOblakN">Oblak</b><em id="sideOblakS">preverjam …</em></span>
      </button>
      <button class="btn btn-quiet btn-w" id="tema">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v1.8M12 19.2V21M4.8 12H3M21 12h-1.8M6.7 6.7 5.4 5.4M18.6 18.6l-1.3-1.3M6.7 17.3l-1.3 1.3M18.6 5.4l-1.3 1.3"/><circle cx="12" cy="12" r="3.8"/></svg>
        Svetlo / temno</button>
      <div class="side-stanje">
        <span class="saved" id="saved">shranjeno</span>
        <span class="verzija" id="verzija" title="Različica aplikacije"></span>
      </div>
    </div>
  </aside>

  <div class="side-veil" id="sideVeil" hidden></div>

  <div class="body">
    <div class="mob">
      <button class="mob-btn" id="sideOpen" aria-label="Odpri meni">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" stroke-linecap="round"/></svg>
      </button>
      <span class="mob-t" id="mobTitle">Oglasni list</span>
    </div>

    <main>
      <section class="view" id="v-projekti" role="tabpanel" aria-labelledby="tab-projekti" tabindex="-1" hidden></section>
      <section class="view" id="v-pregled" role="tabpanel" aria-labelledby="tab-pregled" tabindex="-1" hidden></section>
      <section class="view" id="v-kreative" role="tabpanel" aria-labelledby="tab-kreative" tabindex="-1" hidden></section>
      <section class="view" id="v-kalkulator" role="tabpanel" aria-labelledby="tab-kalkulator" tabindex="-1" hidden></section>
      <section class="view" id="v-podatki" role="tabpanel" aria-labelledby="tab-podatki" tabindex="-1" hidden></section>
    </main>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="lb" id="lb" hidden>
  <button class="lb-x" id="lb-x" aria-label="Zapri predogled">
    <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg>
  </button>
  <div class="lb-in" id="lb-in"></div>
</div>

<script src="verzija.js"></script>
<script src="config.js"></script>
<!-- Koda je razdeljena po datotekah. Vrstni red šteje samo pri zagon.js,
     ki mora ostati zadnji — takrat je vse ostalo že naloženo. -->
<script src="js/osnove.js"></script>
<script src="js/stanje.js"></script>
<script src="js/izracuni.js"></script>
<script src="js/datoteke.js"></script>
<script src="js/pogledi.js"></script>
<script src="js/kreative.js"></script>
<script src="js/predogled.js"></script>
<script src="js/kalkulator.js"></script>
<script src="js/oblak.js"></script>
<script src="js/podatki.js"></script>
<script src="js/excel.js"></script>
<script src="js/dogodki.js"></script>
<script src="js/zagon.js"></script>
</body>
</html>
